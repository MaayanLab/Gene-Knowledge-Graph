version: '3.9'
services:
  kg:
    build:
      context: .
      dockerfile: ./Dockerfile.next
      args:
        - NEO4J_URL=bolt://neo4j:7687
        - NEO4J_V5_URL
        - NEO4J_V4_URL
        - NEXT_PUBLIC_PREFIX
        - NEXT_PUBLIC_COOKIE_NAME
        - NEXT_PUBLIC_ENRICHR_URL
        - NEXT_PUBLIC_GENESHOT_URL
    platform: linux/amd64
    # image: maayanlab/enrichr-kg:2.6.6
    image: maayanlab/enrichr-kg:2.5.16
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: https://maayanlab.cloud/enrichr-kg
    ports:
      - 3000:3000
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_V5_URL
      - NEO4J_V4_URL
      - NEXT_PUBLIC_ENRICHR_URL=https://maayanlab.cloud/Enrichr
      - NEXT_PUBLIC_GENESHOT_URL=https://maayanlab.cloud/geneshot
      - NEO4J_USER
      - NEO4J_NAME
      - NEO4J_PASSWORD
      - NEXT_PUBLIC_PREFIX
      - NEXT_PUBLIC_GA_MEASUREMENT_ID
      - NEXT_PUBLIC_HOST
      - NEXT_PUBLIC_SCHEMA
      - TURL
      - TURL_URL

  neo4j:
    image: neo4j:4.4
    x-kubernetes:
      imagePullPolicy: IfNotPresent
    environment:
      - NEO4JLABS_PLUGINS='["apoc", "n10s"]'
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_heap_max__size=8G
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_server_config_strict__validation_enabled=false
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - enrichr-kg-neo4j:/data

volumes:
  enrichr-kg-neo4j:
    x-kubernetes:
      size: 25Gi
      class: gp2

x-kubernetes:
  name: enrichr-kg
  namespace: enrichr-kg
